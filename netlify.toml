[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NPM_VERSION = "10"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Optional: redirect udi.fdx.trading → /c/udi (only works if udi.fdx.trading points to this Netlify site)
[[redirects]]
  from = "https://udi.fdx.trading/*"
  to = "https://fdx.trading/Business-card/udi"
  status = 301
  force = true
