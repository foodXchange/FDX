<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 651 156" width="651" height="156">
  <title>FoodXchange (dark)</title>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@700&amp;display=swap');
      text { font-family: 'Poppins', 'DejaVu Sans', Arial Black, sans-serif; }
    </style>
  </defs>
  <!-- Background -->
  <rect width="651" height="156" rx="8" fill="#1B2A4A"/>
  <!-- Food (white) -->
  <text x="40" y="113" font-family="Poppins, Arial Black, sans-serif" font-size="80" font-weight="700" fill="#FFFFFF">Food</text>
  <!-- X (orange) -->
  <text x="240" y="113" font-family="Poppins, Arial Black, sans-serif" font-size="80" font-weight="700" fill="#F47920">X</text>
  <!-- change (white) -->
  <text x="297" y="113" font-family="Poppins, Arial Black, sans-serif" font-size="80" font-weight="700" fill="#FFFFFF">change</text>
</svg>